apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voting
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/LorenzoSarti22/gitops-tesi.git
    targetRevision: HEAD
    path: apps/voting
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
