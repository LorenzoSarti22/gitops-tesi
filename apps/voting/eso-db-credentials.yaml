apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-reader
  namespace: vault-sim
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["selfsubjectrulesreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-reader
  namespace: vault-sim
subjects:
- kind: ServiceAccount
  name: eso-reader
  namespace: default
roleRef:
  kind: Role
  name: eso-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-sim
spec:
  provider:
    kubernetes:
      remoteNamespace: vault-sim
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials-eso
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-sim
    kind: SecretStore
  target:
    name: db-credentials-eso
  data:
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: db-credentials
      property: POSTGRES_PASSWORD
